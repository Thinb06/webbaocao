<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm sản phẩm | THE MAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="hinhanh/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo"><a href="web.html">THE MAN.</a></div>
        <nav>
            <ul>
                <li><a href="web.html#products">Cửa hàng</a></li>
                <li><a href="search.html">Bộ sưu tập</a></li>
                <li><a href="about.html">Về chúng tôi</a></li>
                <li><a href="hotro.html">Hỗ trợ</a></li>
            </ul>
        </nav>
        <div class="nav-icons">  
            <a href="/search.html" class="icon-btn search-btn" title="Tìm kiếm">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <!-- Icon Giỏ hàng (Có kèm số lượng sản phẩm) -->
            <a href="/cart.html" class="icon-btn cart-btn" title="Giỏ hàng">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span> <!-- Số lượng đồ trong giỏ -->
            </a>
        </div>
    </header>

    <main id="product-catalog" class="catalog-page">
        <div class="catalog-heading">
            <div>
                <p class="catalog-eyebrow">THE MAN. COLLECTION</p>
                <h1>Tìm kiếm sản phẩm</h1>
            </div>
            <span id="catalog-result-count" class="catalog-result-count"></span>
        </div>

        <div class="catalog-layout">
            <aside class="catalog-filters" aria-label="Bộ lọc sản phẩm">
                <label class="catalog-search-label" for="catalog-search">Từ khóa</label>
                <input id="catalog-search" type="search" placeholder="Tên sản phẩm..." autocomplete="off">

                <fieldset>
                    <legend>Khoảng giá (VNĐ)</legend>
                    <div class="price-inputs">
                        <input id="min-price" type="number" min="0" placeholder="Từ">
                        <input id="max-price" type="number" min="0" placeholder="Đến">
                    </div>
                </fieldset>

                <fieldset id="size-filters">
                    <legend>Kích thước</legend>
                    <label><input type="checkbox" value="S"> S</label>
                    <label><input type="checkbox" value="M"> M</label>
                    <label><input type="checkbox" value="L"> L</label>
                    <label><input type="checkbox" value="XL"> XL</label>
                    <label><input type="checkbox" value="Free"> Free size</label>
                </fieldset>

                <fieldset id="color-filters">
                    <legend>Màu sắc</legend>
                    <label><input type="checkbox" value="Trắng"> Trắng</label>
                    <label><input type="checkbox" value="Đen"> Đen</label>
                    <label><input type="checkbox" value="Navy"> Navy</label>
                    <label><input type="checkbox" value="Xám"> Xám</label>
                    <label><input type="checkbox" value="Kem"> Kem</label>
                    <label><input type="checkbox" value="Nâu"> Nâu</label>
                </fieldset>

                <button id="reset-filters" type="button" class="reset-filters">Xóa bộ lọc</button>
            </aside>

            <section>
                <div id="homepage-products-grid" class="row"></div>
            </section>
        </div>
    </main>

    <script src="common-layout.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
